openapi: 3.0.1
info:
  title: OpenAPI definition
  version: v0
servers:
- url: ""
  description: Generated server url
tags:
- name: StaffLedgerPostings
  description: Staff submits and recovers an already committed internal USD transfer
    through Accounting Domain
paths:
  /api/v1/staff/records/{area}/{recordId}:
    get:
      tags:
      - Staff Terminal
      operationId: openRecord
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: area
        in: path
        required: true
        schema:
          type: string
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffRecord"
      security:
      - staffBearer: []
      x-disable-idempotency: true
    put:
      tags:
      - Staff Terminal
      operationId: updateRecord
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: area
        in: path
        required: true
        schema:
          type: string
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffRecord"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/configuration/{key}:
    get:
      tags:
      - Staff Terminal
      operationId: getProperty
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: key
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
      security:
      - staffBearer: []
      x-disable-idempotency: true
    put:
      tags:
      - Staff Terminal
      operationId: putProperty
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: string
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/tenants/{tenantId}/books/{bookId}/ledger-journals/recovery:
    post:
      tags:
      - StaffLedgerPostings
      summary: Recover the same complete original action through Domain
      description: Recovery does not issue another monetary POST. Missing evidence
        or current refusal is not an audited no-effect closure.
      operationId: recoverStaffLedgerJournal
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: bookId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPostingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPostingResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "401":
          description: Current authentication failure; security filters can respond
            before application error projection
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "403":
          description: Current authorization failure; prior effects remain uncharacterized
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "422":
          description: Unprocessable Content
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "4XX":
          description: Other exact Domain invocation refusal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPostingResponse"
        default:
          description: Unavailable response; retain complete original action and recover
            through the same route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPostingResponse"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/tenants/{tenantId}/books/{bookId}/ledger-journals:
    post:
      tags:
      - StaffLedgerPostings
      summary: Submit the exact approved original transfer journal through Domain
      description: Experience never calls Core. Core independently verifies the genuine
        current Ledger COMMIT and four-eyes mapping approval. An uncertain response
        does not authorize a replacement action or compensation.
      operationId: postStaffLedgerJournal
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: bookId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPostingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPostingResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "401":
          description: Current authentication failure; security filters can respond
            before application error projection
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "403":
          description: Current authorization failure; prior effects remain uncharacterized
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "422":
          description: Unprocessable Content
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "503":
          description: Service Unavailable
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/StaffPostingResponse"
                - $ref: "#/components/schemas/StaffPostingPreDispatchError"
        "4XX":
          description: Other exact Domain invocation refusal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPostingResponse"
        default:
          description: Unavailable response; retain complete original action and recover
            through the same route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPostingResponse"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/sessions:
    post:
      tags:
      - Staff Terminal
      operationId: signIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffSession"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/records/{area}/{recordId}/remove:
    post:
      tags:
      - Staff Terminal
      operationId: removeDraft
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: area
        in: path
        required: true
        schema:
          type: string
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBody"
        required: true
      responses:
        "200":
          description: OK
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/records/{area}/{recordId}/distributor:
    post:
      tags:
      - Staff Terminal
      operationId: attachDistributor
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: area
        in: path
        required: true
        schema:
          type: string
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffRecord"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/records/{area}/{recordId}/decide:
    post:
      tags:
      - Staff Terminal
      operationId: decideRecord
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: area
        in: path
        required: true
        schema:
          type: string
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffRecord"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/records/{area}/{recordId}/close:
    post:
      tags:
      - Staff Terminal
      operationId: closeRecord
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: area
        in: path
        required: true
        schema:
          type: string
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBody"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StaffRecord"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/tenants/{tenantId}/banks/{bankId}/enrollments/{enrollmentId}/versions/{version}/current:
    get:
      tags:
      - Staff Bank Enrollment Owner
      summary: Read the current Bank enrollment owner
      description: "Authenticated staff administrative observation through the organization\
        \ domain. Current tenant-scoped policy is required at every layer. Native\
        \ and effective observation deadlines are preserved; this is not book, product,\
        \ currency or financial admission."
      operationId: getCurrentStaffBankOwner
      parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: bankId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: enrollmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: version
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffBankOwnerView"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/standing-orders/{runId}:
    get:
      tags:
      - Instructions
      operationId: readStandingOrder
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: runId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StandingOrder"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/records/{area}:
    get:
      tags:
      - Staff Terminal
      operationId: listRecords
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: area
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffRecord"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/masters/{type}:
    get:
      tags:
      - Staff Terminal
      operationId: listMasters
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: type
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MasterRecord"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/distributors:
    get:
      tags:
      - Staff Terminal
      operationId: listDistributors
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DistributorView"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/direct-debits/{mandateId}:
    get:
      tags:
      - Instructions
      operationId: readDirectDebit
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: mandateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DirectDebit"
      security:
      - staffBearer: []
      x-disable-idempotency: true
  /api/v1/staff/accounts/{accountId}/servicing-mandates/{mandateId}:
    get:
      tags:
      - Instructions
      operationId: readMandate
      parameters:
      - name: X-Actor-Id
        in: header
        required: false
        schema:
          type: string
          format: uuid
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: mandateId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Mandate"
      security:
      - staffBearer: []
      x-disable-idempotency: true
components:
  schemas:
    RecordBody:
      type: object
      properties:
        customerPartyId:
          type: string
          format: uuid
        reason:
          type: string
        note:
          type: string
        distributorId:
          type: string
          format: uuid
        collaboratorId:
          type: string
          format: uuid
        channel:
          type: string
        decision:
          type: string
    StaffRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        area:
          type: string
        customerPartyId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        status:
          type: string
        reference:
          type: string
        distributorId:
          type: string
          format: uuid
        note:
          type: string
    PropertyBody:
      type: object
      properties:
        value:
          type: string
    GlCurrencyReference:
      required:
      - currencyId
      - digest
      - encodingVersion
      - isoCode
      - policyId
      - version
      type: object
      properties:
        policyId:
          type: string
        currencyId:
          type: string
        isoCode:
          type: string
        version:
          type: integer
          format: int64
        digest:
          type: string
        encodingVersion:
          type: string
    GlPostingEntry:
      required:
      - description
      - entryKey
      - lines
      type: object
      properties:
        entryKey:
          type: string
        description:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/GlPostingLine"
    GlPostingLine:
      required:
      - accountId
      - amountMinor
      - currency
      - currencyAdmissionId
      - expectedAccountVersion
      - expectedCurrencyVersion
      - lineKey
      - memo
      - postedScale
      - side
      type: object
      properties:
        lineKey:
          type: string
        accountId:
          type: string
        expectedAccountVersion:
          type: integer
          format: int64
        currencyAdmissionId:
          type: string
        expectedCurrencyVersion:
          type: integer
          format: int64
        currency:
          $ref: "#/components/schemas/GlCurrencyReference"
        postedScale:
          type: integer
          format: int32
        side:
          type: string
        amountMinor:
          type: string
        memo:
          type: string
    GlPostingRequest:
      required:
      - actionId
      - businessDate
      - description
      - entries
      - expectedBookVersion
      - expectedPeriodVersion
      - mappingDigest
      - mappingId
      - mappingVersion
      - notAfterEpochMillis
      - periodId
      - source
      - sourceOccurrenceEpochMillis
      type: object
      properties:
        actionId:
          type: string
        periodId:
          type: string
        expectedBookVersion:
          type: integer
          format: int64
        expectedPeriodVersion:
          type: integer
          format: int64
        notAfterEpochMillis:
          type: integer
          format: int64
        businessDate:
          type: string
        sourceOccurrenceEpochMillis:
          type: integer
          format: int64
        source:
          $ref: "#/components/schemas/GlSourceReference"
        mappingId:
          type: string
        mappingVersion:
          type: integer
          format: int64
        mappingDigest:
          type: string
        description:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/GlPostingEntry"
    GlSourceReference:
      required:
      - digest
      - effectOrdinal
      - effectReference
      - eventKind
      - financialReceiptReference
      - objectReference
      - observedAtEpochMillis
      - owner
      - provenanceReference
      - revision
      type: object
      properties:
        owner:
          type: string
        objectReference:
          type: string
        effectReference:
          type: string
        revision:
          type: integer
          format: int64
        digest:
          type: string
        eventKind:
          type: string
        effectOrdinal:
          type: integer
          format: int32
        financialReceiptReference:
          type: string
        provenanceReference:
          type: string
        observedAtEpochMillis:
          type: integer
          format: int64
    StaffPostingRequest:
      required:
      - expectedIntentDigest
      - posting
      type: object
      properties:
        expectedIntentDigest:
          pattern: "[0-9a-f]{64}"
          type: string
        posting:
          $ref: "#/components/schemas/GlPostingRequest"
      additionalProperties: false
    StaffPostingReceipt:
      required:
      - recordedAt
      type: object
      properties:
        receiptId:
          type: string
          format: uuid
        actionId:
          type: string
          format: uuid
        postingId:
          type: string
          format: uuid
        journalSequence:
          type: integer
          format: int64
        intentDigest:
          type: string
        recovered:
          type: boolean
        recordedAt:
          $ref: "#/components/schemas/FireflyInstant"
      additionalProperties: false
    StaffPostingResponse:
      type: object
      properties:
        actionId:
          type: string
          format: uuid
        intentDigest:
          type: string
        status:
          type: string
          enum:
          - COMMITTED
          - OUTCOME_UNKNOWN
          - COMMITTED_RESPONSE_UNAVAILABLE
          - CURRENT_INVOCATION_REFUSED
          - NOT_OBSERVED
          - DOMAIN_PRE_DISPATCH_REFUSED
        domainStatus:
          type: integer
          format: int32
        ownerStatus:
          type: integer
          format: int32
        receipt:
          $ref: "#/components/schemas/StaffPostingReceipt"
      additionalProperties: false
    StaffPostingPreDispatchError:
      type: object
      properties:
        status:
          type: integer
          format: int32
        code:
          type: string
          enum:
          - STAFF_POSTING_PRE_DISPATCH_REJECTED
        phase:
          type: string
          enum:
          - BEFORE_DOMAIN_DISPATCH
      additionalProperties: false
    SignInRequest:
      type: object
      properties:
        username:
          type: string
    StaffSession:
      type: object
      properties:
        actorId:
          type: string
          format: uuid
        provider:
          type: string
    StaffBankOwnerView:
      type: object
      properties:
        tenantId:
          type: string
          format: uuid
        bankId:
          type: string
          format: uuid
        enrollmentId:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
        institutionId:
          type: string
          format: uuid
        issuerAuthorityId:
          type: string
          format: uuid
        allowedUses:
          uniqueItems: true
          type: array
          items:
            type: string
        controlVersion:
          type: integer
          format: int64
        ownershipGeneration:
          type: integer
          format: int64
        bankGeneration:
          type: integer
          format: int64
        sourceGeneration:
          type: integer
          format: int64
        currentUntilEpochMillis:
          type: integer
          format: int64
        observationUntilEpochMillis:
          type: integer
          format: int64
    StandingOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        paymentScheduleId:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          type: string
        valueDate:
          type: string
          format: date
    MasterRecord:
      type: object
      properties:
        type:
          type: string
