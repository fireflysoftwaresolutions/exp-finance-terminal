components:
  schemas:
    RecordBody:
      type: object
      properties:
        customerPartyId:
          type: string
          format: uuid
        reason:
          type: string
        note:
          type: string
        distributorId:
          type: string
          format: uuid
        collaboratorId:
          type: string
          format: uuid
        channel:
          type: string
        decision:
          type: string
    StaffRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        area:
          type: string
        customerPartyId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        status:
          type: string
        reference:
          type: string
        distributorId:
          type: string
          format: uuid
        note:
          type: string
    PropertyBody:
      type: object
      properties:
        value:
          type: string
    SignInRequest:
      type: object
      properties:
        username:
          type: string
    StaffSession:
      type: object
      properties:
        actorId:
          type: string
          format: uuid
        provider:
          type: string
    StandingOrder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        paymentScheduleId:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          type: string
        valueDate:
          type: string
          format: date
    MasterRecord:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
    DistributorView:
      type: object
      properties:
        distributorId:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
        partyId:
          type: string
          format: uuid
        channel:
          type: string
        agencyId:
          type: string
          format: uuid
        collaboratorId:
          type: string
          format: uuid
    DirectDebit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        debtorAccountId:
          type: string
          format: uuid
        creditorPartyId:
          type: string
          format: uuid
        status:
          type: string
        amountLimit:
          type: number
        currency:
          type: string
        reference:
          type: string
    Mandate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        partyId:
          type: string
          format: uuid
        role:
          type: string
        active:
          type: boolean
  securitySchemes:
    staffBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
