server:
  port: ${SERVER_PORT:8120}

spring:
  application:
    name: exp-finance-terminal
  threads:
    virtual:
      enabled: true

api-configuration:
  domain-platform:
    security-center:
      base-path: ${SECURITY_CENTER_URL:http://localhost:8085}

firefly:
  terminal:
    adapter: ${FIREFLY_TERMINAL_ADAPTER:sandbox}
    configuration-base-url: ${CONFIG_MGMT_URL:http://localhost:8088}
    master-data-base-url: ${MASTER_DATA_URL:http://localhost:8089}
    distributor-base-url: ${DISTRIBUTOR_MGMT_URL:http://localhost:8070}
    domains:
      accounts: ${BANKING_ACCOUNTS_URL:http://localhost:8090}
      cards: ${BANKING_CARDS_URL:http://localhost:8091}
      lending-applications: ${LOAN_ORIGINATION_URL:http://localhost:8092}
      mortgage-agreements: ${MORTGAGE_URL:http://localhost:8093}
      supply-chain-finance-agreements: ${SUPPLY_CHAIN_FINANCE_URL:http://localhost:8094}
      collateral-cases: ${COLLATERAL_URL:http://localhost:8095}
      collection-cases: ${COLLECTIONS_URL:http://localhost:8097}
      provisioning-cases: ${PROVISIONING_URL:http://localhost:8098}
      aml-cases: ${AML_URL:http://localhost:8099}
